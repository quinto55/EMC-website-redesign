<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EMC Tickets sharing image</title>
<!--
  The 1200 x 630 sharing image (public/emc-site/og-image.png). With `npm run dev` running,
  render it with headless Chrome at --window-size=1200,630 (see the relaunch plan, task 2).
-->
<style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 200 800; src: url('/emc-site/fonts/bricolage-grotesque-var.woff2') format('woff2'); }
  @font-face { font-family: 'DM Mono'; font-weight: 500; src: url('/emc-site/fonts/dm-mono-500.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fff8ec;
    color: #1b1f2a;
    display: grid;
    grid-template-columns: 298px minmax(0, 1fr);
    align-items: center;
    gap: 76px;
    padding: 0 84px;
  }
  img { display: block; width: 298px; height: 238px; }
  .label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #ecdfca;
    border-radius: 999px;
    padding: 8px 18px 8px 14px;
    font: 500 18px 'DM Mono', monospace;
    color: #5d6370;
    margin-bottom: 26px;
  }
  .label i { width: 11px; height: 11px; border-radius: 50%; background: #19b85a; }
  h1 { font: 700 76px/1.04 'Bricolage Grotesque', sans-serif; letter-spacing: -.025em; }
  h1 u { text-decoration: none; white-space: nowrap; background: linear-gradient(transparent 64%, #ffd66b 64%); }
</style>
</head>
<body>
  <img src="/emc-site/img/emc-logo-on-light.png" width="298" height="238" alt="EMC Tickets">
  <div>
    <p class="label"><i></i>Ticketing for fairs and festivals</p>
    <h1>One system from <u>first ticket</u> to <u>final report</u>.</h1>
  </div>
</body>
</html>
