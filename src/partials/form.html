<div class="ask-side">
  <div class="ask-card ask-fallback" data-ask-fallback>
    <a class="ask-button" href="mailto:{{LEAD_EMAIL}}?subject=Website%20inquiry">Email Anthony</a>
    <p class="ask-or">or call toll free, 24/7: <a href="tel:{{TOLL_FREE_TEL}}">{{TOLL_FREE}}</a></p>
  </div>
  <form class="ask-card ask-form" data-ask-form hidden>
    <label>Your name<input type="text" name="name" autocomplete="name" maxlength="120" required></label>
    <label>Fair or event<input type="text" name="event" autocomplete="organization" maxlength="160" required></label>
    <label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required></label>
    <label>Anything we should know? <span class="opt">(optional)</span><textarea name="message" rows="3" maxlength="2000"></textarea></label>
    <div class="visually-hidden" aria-hidden="true">
      <label>Leave this box unchecked<input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true"></label>
    </div>
    <button type="submit" class="ask-button" data-ask-submit>{{ASK_BUTTON}}</button>
    <p class="ask-note">We only use this to reply to you. See our <a href="/privacy/">Privacy Policy</a>.</p>
    <p class="ask-status" data-ask-status role="alert"></p>
  </form>
  <div class="ask-card ask-thanks" data-ask-thanks hidden></div>
</div>
