# BEGIN EMC static site
# Written 2026-11-19. Remove this block to undo: delete every line from the BEGIN line to the END line and change nothing else.
# A folder that holds an index.html (the web root and the new page folders) now shows it; folders without one behave as before.
DirectoryIndex index.html index.php
<IfModule mod_rewrite.c>
RewriteEngine On
# WordPress's own addresses at / still go to WordPress: a form posted to /, a search (?s=), a short link or preview (?p=, ?page_id=, ?preview=), a form plugin's address (?gf_page=, ?jet_form_builder_submit=), ?rest_route=, ?wc-ajax= and ?feed=.
RewriteCond %{REQUEST_METHOD} =POST [OR]
RewriteCond %{QUERY_STRING} (^|&)(s|p|page_id|preview|rest_route|gf_page|wc-ajax|feed|jet_form_builder_submit)= [NC]
RewriteRule ^$ /index.php [L]
# Old address /what-we-do/ moves for good to the new Platform page.
RewriteRule ^what-we-do/?$ /platform/ [R=301,L]
# On the two rules below, QSD drops any ?tracking=... part of the old address, so the visitor lands on the section and the address after the # still matches it. QSD needs Apache 2.4; on an older Apache remove ,QSD from both lines.
# Old address /online/ moves for good to the online sales part of the Platform page.
RewriteRule ^online/?$ /platform/#online-sales [R=301,NE,QSD,L]
# Old address /onsite/ moves for good to the box office part of the Platform page.
RewriteRule ^onsite/?$ /platform/#box-office [R=301,NE,QSD,L]
# Old address /social/ moves for good to the new Marketing page.
RewriteRule ^social/?$ /marketing/ [R=301,L]
# Old address /contact-us/ moves for good to the new Contact page.
RewriteRule ^contact-us/?$ /contact/ [R=301,L]
# Old address /privacy-and-terms/ moves for good to the new Privacy page.
RewriteRule ^privacy-and-terms/?$ /privacy/ [R=301,L]
# Old address /walgreens/ moves for good to the new Retail partners page.
RewriteRule ^walgreens/?$ /retail-partners/ [R=301,L]
# Old address /events/ (an empty page) moves for good to the home page.
RewriteRule ^events/?$ / [R=301,L]
</IfModule>
# END EMC static site
